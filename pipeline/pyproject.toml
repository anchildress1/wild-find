[project]
name = "wild-find-pipeline"
version = "0.1.0"
description = "Build-time menu, fact cards, and label embeddings for wild-find."
requires-python = ">=3.13"
dependencies = ["numpy>=2.3", "pillow>=11.3"]

[dependency-groups]
dev = ["gitlint-rai>=1.0.3", "pytest>=9.1.1", "ruff>=0.16.10"]
# Model runtimes for `make reference` only; lint and unit tests never import them.
reference = ["huggingface-hub>=0.35", "onnxruntime>=1.23", "open-clip-torch>=3.3.0", "torch>=2.9", "torchvision>=0.29"]

[tool.uv]
# gitlint-core's trusted-deps extra hard-pins vulnerable click (PYSEC-2026-2132) and sh (CVE-2026-54552).
override-dependencies = ["click>=8.5.0", "sh>=2.2.4"]

# Linux gets CPU-only torch and torchvision from one index; the PyPI wheels drag in ~2.5 GB of CUDA.
# torchvision is listed directly in the reference group because sources only apply to direct dependencies.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

  [52, ".models/holdout-photos/target_Solidago_altissima_403424772.jpg", "Solidago altissima"],
];
// This page sits four levels below the repo root; the .models caches are gitignored, so photos are read in place.
const ROOT = "../../../../";
const photo = document.getElementById("photo");
const tag = document.getElementById("tag");
let index = 0;
let showTarget = false;

function render() {
  const [order, file, target] = PHOTOS[index];
  photo.classList.remove("blank");
  photo.src = ROOT + file;
  tag.textContent = `#${order}/${PHOTOS.length}` + (showTarget ? ` ${target}` : "");
  if (location.hash !== `#${order}`) history.replaceState(null, "", `#${order}`);
}

function fromHash() {
  const i = PHOTOS.findIndex(([order]) => `#${order}` === location.hash);
  index = i < 0 ? 0 : i;
  render();
}

photo.addEventListener("error", () => { tag.textContent += " MISSING"; tag.style.color = "#a33"; });

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") index = Math.min(index + 1, PHOTOS.length - 1);
  else if (e.key === "ArrowLeft") index = Math.max(index - 1, 0);
  else if (e.key === "i") showTarget = !showTarget;
  else if (e.key === "b") { photo.classList.toggle("blank"); return; }
  else if (e.key === "f") { document.documentElement.requestFullscreen(); return; }
  else return;
  e.preventDefault();
  render();
});
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
